name: 🐛 Report a bug
description: Something in the pipeline, feeds or website is behaving incorrectly.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug, including the URL or command you ran.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command / page
      description: e.g. `python3 scripts/omnisource.py --no-sync`, https://raynmahbub.github.io/OmniSource/
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant error output or console messages.
      render: text
